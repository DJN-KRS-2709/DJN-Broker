# Basic configuration
timezone: "Europe/Berlin"
capital_eur: 500

# Trading Mode: "swing" (default) or "micro"
# swing: 5% SL, 8% TP, 24h min hold
# micro: 1.5% SL, 2% TP, 0h min hold - experimental, paper-only recommended
trading_mode: "micro"

# Risk (aggressive). Sized to the ~2h check cadence so stops actually protect.
risk:
  max_positions: 3            # up to 3 names
  max_alloc_per_trade: 0.30   # ~30% per trade
  stop_loss_pct: 0.03         # 3% stop (realistic for 2h polling, not 0.4%)
  take_profit_pct: 0.05       # 5% target (reward:risk ~1.67:1)
  
# Swing Trading Parameters
trading_style: "swing"        # swing or day
min_hold_hours: 24           # Hold at least 24 hours
max_hold_days: 5             # Exit after 5 days max (tighter)

# Micro mode overrides (applied when trading_mode: "micro").
# Day-style: no minimum hold, but exits sized to the 2h cadence and a real signal bar.
micro_mode:
  stop_loss_pct: 0.03        # match risk.stop_loss_pct (no fake 0.4% stop)
  take_profit_pct: 0.05      # match risk.take_profit_pct
  min_hold_hours: 0
  trading_style: "day"
  min_sentiment: 0.15        # only act on meaningful positive sentiment (was 0.02)
  min_score_threshold: 0.25  # only real setups, not noise (was 0.08)

# Optional default for non-micro; micro_mode overrides when present
strategy:
  min_score_threshold: 0.25

# Learning System Settings
learning:
  enabled: true
  allow_pause_on_loss: false  # Must be false for continuous live trading (do not stop the bot)
  min_trades_for_learning: 5
  strategy_update_frequency: 3
  performance_lookback_days: 14

# Execution quality (best-practice order handling)
execution:
  order_type: "limit"          # marketable limit caps slippage vs naked market orders
  limit_slippage_pct: 0.002    # cross the spread by max 0.2% to still get filled
  respect_market_hours: true   # don't trade when the US market is closed (illiquid/bad fills)
  extended_hours: false
  skip_if_already_held: true   # no pyramiding into a name we already hold

# Live brokerage: do NOT force a buy when flat (only trade real signals)
live_execution:
  guaranteed_buy_when_flat: false

# Forced churn disabled: no fallback buys, no 2h rotation (was bleeding via costs)
daily_activity:
  enabled: false
  fallback_buy_when_no_signals: false
  aggressive_every_run: false
  time_exit_hours: 2           # only used if daily_activity.enabled is true

# Entry quality
entry_quality:
  strict_mode: false
  min_sentiment_high: 0.45
  avoid_tickers: []            # Empty = trade full universe (aggressive)

universe:
  # Best performers only - removed TSLA (consistently worst)
  - "AAPL"   # Apple - your best performer
  - "GOOGL"  # Google - solid performer
  - "MSFT"   # Microsoft - stable
  - "NVDA"   # NVIDIA - high momentum plays

data:
  yfinance:
    period: "14d"    # Longer lookback for swing trends
    interval: "1h"   # 1-hour bars perfect for swing trading
  news:
    use_newsapi: true          # if NEWSAPI_KEY absent, code falls back to RSS automatically
    languages: ["en", "de"]
    query: "stocks OR market OR DAX OR ECB OR earnings"
    rss_feeds:
      - "https://www.reuters.com/finance/markets/europe/rss"
      - "https://www.ecb.europa.eu/press/pressconf/2024/html/index.en.html"
      - "https://www.investing.com/rss/news_285.rss"

reddit:
  subreddits: ["stocks", "investing", "wallstreetbets", "StockMarket"]
  limit_per_sub: 25

alpaca:
  paper_trading: false  # LIVE trading - real money
  use_alpaca: true     # Set to false to use paper simulation instead
  
# Dual Trading Mode — only used if you run `python dual_trading.py` (not `main.py` / not GitHub Actions)
dual_trading:
  enabled: false
  paper_min_sentiment: 0.20        # Paper: Raised from 0.15 (fewer, higher quality signals)
  live_min_sentiment: 0.35         # Live: Raised from 0.25 (only strong signals!)
  live_max_positions: 2            # Live: Max 2 positions at a time
  live_max_alloc: 0.25             # Live: 25% per trade (was 20%)
  require_paper_winrate: 0.40      # Raised from 0.30 - need better paper results first